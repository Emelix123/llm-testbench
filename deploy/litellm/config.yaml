# LiteLLM-Gateway für die Szenarien K0–K4 und K6 (eine geteilte vLLM-Instanz).
# Was je Szenario anders ist, steuern Umgebungsvariablen (Hook, Grenzen je Mandant über die Keys).
model_list:
  - model_name: llm
    litellm_params:
      model: hosted_vllm/llm
      api_base: http://vllm:8000/v1
      api_key: os.environ/VLLM_API_KEY
      # keine stillen Wiederholungen – sie würden Messungen verfälschen
      max_retries: 0
      timeout: 600
      stream_timeout: 600

litellm_settings:
  # Mandanten-Hook (cache_salt je Mandant, Feld-Filter, n-Grenze, Routing). In K0 per Env abgeschaltet.
  callbacks: tenant_isolation.proxy_handler_instance
  # Unbekannte vLLM-Parameter (ignore_eos, min_tokens, cache_salt) NICHT stillschweigend verwerfen
  drop_params: false
  num_retries: 0
  request_timeout: 600
  # Antwort-Cache aus: er würde TTFT und Qualität verfälschen und wäre selbst ein Seitenkanal
  cache: false

router_settings:
  num_retries: 0
  allowed_fails: 1000
  cooldown_time: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Prompts/Antworten nicht in der Datenbank ablegen (DSGVO, Datenminimierung)
  store_prompts_in_spend_logs: false
  # Ratenbegrenzung je Key/Team zählt in-process; bei mehreren Gateway-Instanzen Redis nötig
